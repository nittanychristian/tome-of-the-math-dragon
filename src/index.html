<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tome of the Math Dragon</title>
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('PressStart2P-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      width: 480px;
      height: 640px;
      max-width: 100vw;
      max-height: 100svh;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="elm.js"></script>
  <script>
    var savedName = localStorage.getItem('tomePlayerName') || '';

    var app = Elm.Main.init({
      node: document.getElementById('app'),
      flags: savedName + '\t' + Date.now()
    });

    app.ports.saveName.subscribe(function(name) {
      localStorage.setItem('tomePlayerName', name);
    });

    app.ports.focusFirstInput.subscribe(function() {
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          var inp = document.querySelector('#app input');
          if (inp) inp.focus();
        });
      });
    });
  </script>
</body>
</html>
